<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Continuous mark: an endless loop in two phases, a yin and yang. The left lobe
       is planning (cyan), the right building (pale), and each holds a dot of the
       other's colour. The same figure is the Loop mode mark in the app
       (gui/src/components/LoopPhaseMark). Regenerate every derived asset with:
       node brand-src/render.js -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#shine)"/>
  <g fill="none" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 256 C212 172 100 172 100 256 C100 340 212 340 256 256" stroke="#22D3EE"/>
    <path d="M256 256 C300 172 412 172 412 256 C412 340 300 340 256 256" stroke="#F5F3FF"/>
  </g>
  <circle cx="161.5" cy="319" r="30" fill="#F5F3FF"/>
  <circle cx="350.5" cy="193" r="30" fill="#22D3EE"/>
</svg>
